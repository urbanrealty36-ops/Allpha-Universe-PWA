[project]
name = "allpha-api"
version = "0.1.0"
description = "Allpha Universe backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.35,<1.0",
  "PyJWT[crypto]==2.10.1",
  "httpx==0.28.1"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2"
]

[tool.ruff]
line-length = 100
target-version = "py312"
