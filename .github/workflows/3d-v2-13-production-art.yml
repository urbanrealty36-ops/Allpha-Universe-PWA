name: 3D-V2.13 Production Realistic Art Gate
# Golden visual QA retrigger: Crystal AI City

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/3d/blender/**"
      - "scripts/3d/qa-v2-13-production-art.mjs"
      - "apps/web/lib/world-engine/production-realistic-art-v2-13.ts"
      - ".github/workflows/3d-v2-13-production-art.yml"
      - "package.json"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Validate V2.13 contract
        run: pnpm qa:3d:v2.13
      - name: Upload contract report
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13-contract-report
          path: 3d-v2-13-production-art-qa-report.json

  golden-blender:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version
      - name: Build Crystal AI City golden production art
        env:
          ALLPHA_V213_OUT: allpha-theme-v2-13-golden-pack
          BLENDER_BIN: /opt/blender/blender
        run: |
          /opt/blender/blender -b --python scripts/3d/blender/build_v2_13_production_art.py -- --theme crystal-ai-city --preview
      - name: Inspect generated golden matrix
        run: |
          test -f allpha-theme-v2-13-golden-pack/manifest.json
          test "$(find allpha-theme-v2-13-golden-pack/crystal-ai-city -name '*.glb' | wc -l)" = "14"
          test "$(find allpha-theme-v2-13-golden-pack/crystal-ai-city -name '*.png' | wc -l)" = "14"
      - name: Upload golden GLB + render evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13-crystal-ai-city-golden-pack
          path: allpha-theme-v2-13-golden-pack/
