name: V2.13D.4 Explicit Production Promotion & Storage Gate
run-name: V2.13D.4 Production Promotion • ${{ github.event_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/3d/v2-13d4-storage-promotion.mjs"
      - "scripts/3d/v2-13d4-storage-promotion.schema.json"
      - "docs/3d/V2.13D.4-EXPLICIT-PRODUCTION-PROMOTION-STORAGE-GATE.md"
      - ".github/workflows/v2-13d4-explicit-production-promotion-storage-gate.yml"
  workflow_dispatch:
    inputs:
      d3d_decision_run_id:
        description: "Post-D3D decision evidence workflow run ID"
        required: true
        default: "37569728546"
      production_promotion_approval:
        description: "Explicit production promotion approval"
        required: true
        type: choice
        options: ["false","true"]
        default: "false"
      confirmation:
        description: "Exact confirmation phrase"
        required: true
        default: "V2.13D.4 APPROVE 100 MACRO ASSETS"

permissions:
  actions: read
  contents: read

jobs:
  pr-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate promotion script syntax
        run: node --check scripts/3d/v2-13d4-storage-promotion.mjs
      - name: Validate promotion schema
        run: node -e 'const s=require("./scripts/3d/v2-13d4-storage-promotion.schema.json"); if(s.properties.phase.const!=="V2.13D.4"||s.properties.assets.const!==100||s.properties.bucket.const!=="allpha-world-assets") process.exit(1); console.log("V2.13D.4 contract PASS")'
      - name: Confirm mutation boundary
        run: |
          echo "PR preflight only: no Storage mutation, no Supabase mutation."
          echo "Production mutation requires workflow_dispatch plus explicit approval."

  storage-promotion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: qltbacemtvnuzqkterly
      SUPABASE_URL: https://qltbacemtvnuzqkterly.supabase.co
      ALLPHA_3D_HUMAN_VISUAL_FIDELITY_APPROVED: "true"
      ALLPHA_3D_PRODUCTION_PROMOTION_APPROVED: ${{ inputs.production_promotion_approval || 'false' }}
      ALLPHA_3D4_CONFIRMATION: ${{ inputs.confirmation || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit approval
        if: inputs.production_promotion_approval != 'true' || inputs.confirmation != 'V2.13D.4 APPROVE 100 MACRO ASSETS'
        run: |
          echo "Explicit V2.13D.4 production approval is required."
          exit 1

      - name: Download locked D3C evidence
        uses: actions/download-artifact@v5
        with:
          name: allpha-3d-v2-13d3c-cinematic-visual-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: urbanrealty36-ops/Allpha-Universe-PWA
          run-id: 37553533713
          path: d3c-evidence

      - name: Download locked D3D decision evidence
        uses: actions/download-artifact@v5
        with:
          name: allpha-3d-v2-13d-post-d3d-promotion-decision
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: urbanrealty36-ops/Allpha-Universe-PWA
          run-id: ${{ inputs.d3d_decision_run_id || '37569728546' }}
          path: d3d-decision

      - name: Promote exactly 100 macro assets
        env:
          ALLPHA_D3C_EVIDENCE_ROOT: d3c-evidence
          ALLPHA_D3D_DECISION_JSON: d3d-decision/v2-13d-post-d3d-promotion-decision.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/3d/v2-13d4-storage-promotion.mjs

      - name: Validate promotion report
        run: |
          node -e 'const r=require("./v2-13d4-storage-promotion-report.json"); if(r.decision!=="PROMOTED_100_MACRO_ASSETS"||r.assets!==100||r.uploaded!==100||r.registeredThemeAssets!==100) process.exit(1); console.log(JSON.stringify(r,null,2))'

      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d4-storage-promotion-evidence
          path: v2-13d4-storage-promotion-report.json
          if-no-files-found: error
          retention-days: 30
