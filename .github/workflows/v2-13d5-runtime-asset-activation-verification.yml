name: V2.13D.5 Runtime Asset Activation / Consumption Verification

on:
  push:
    branches:
      - codex/v2-13d5-runtime-asset-activation-verification
    paths:
      - "scripts/3d/v2-13d5-runtime-asset-activation-verification.mjs"
      - "scripts/3d/v2-13d5-runtime-activation.schema.json"
      - "apps/web/components/world/theme-v2-production-asset-scene.tsx"
      - "apps/web/lib/world-engine/production-3d-runtime-resolver.ts"
      - "apps/api/app/api/world_runtime.py"
      - ".github/workflows/v2-13d5-runtime-asset-activation-verification.yml"
  pull_request:
    paths:
      - "scripts/3d/v2-13d5-runtime-asset-activation-verification.mjs"
      - "scripts/3d/v2-13d5-runtime-activation.schema.json"
      - "apps/web/components/world/theme-v2-production-asset-scene.tsx"
      - "apps/web/lib/world-engine/production-3d-runtime-resolver.ts"
      - "apps/api/app/api/world_runtime.py"
      - ".github/workflows/v2-13d5-runtime-asset-activation-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify script syntax
        run: node --check scripts/3d/v2-13d5-runtime-asset-activation-verification.mjs
      - name: Verify live Railway consumption path
        env:
          ALLPHA_RUNTIME_API_BASE_URL: https://allpha-api-production.up.railway.app
        run: node scripts/3d/v2-13d5-runtime-asset-activation-verification.mjs
      - name: Validate evidence schema
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("artifacts/v2-13d5/runtime-activation-report.json", "utf8"));
          const expected = {
            schema: "allpha-3d-v2-13d5-runtime-activation-verification/1.0",
            phase: "V2.13D.5",
            status: "GREEN",
            bucket: "allpha-world-assets",
            root: "theme-v2-real-3d/v2.13",
            themes: 25,
            categories: 4,
            assets: 100,
            manifestsVerified: 25,
            signedAssetsVerified: 100,
            staticRendererContract: true,
            staticApiContract: true,
            mutationPerformed: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (report[key] !== value) throw new Error("Evidence mismatch: " + key + "=" + report[key]);
          }
          console.log("V2.13D.5 evidence schema PASS");
          NODE
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d5-runtime-activation-evidence
          path: artifacts/v2-13d5/runtime-activation-report.json
          if-no-files-found: error
