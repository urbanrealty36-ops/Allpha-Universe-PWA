name: V2.13D Post-D3D Promotion Evidence Closure
run-name: V2.13D Post-D3D Promotion Evidence Closure • ${{ github.event_name }}

on:
  push:
    branches:
      - codex/v2-13d-post-d3d-promotion-evidence-closure
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: D3C source workflow run ID
        required: true
        default: "37553533713"
      review_json:
        description: Structured D3D human review JSON
        required: true
        default: '{"schema":"allpha-3d-v2-13d3d-human-visual-fidelity-review/1.0","phase":"V2.13D.3D","goldenReference":"crystal-ai-city","sourceRunId":37553533713,"sourceHeadSha":"eb6892492c4ba7188ecd6c9c8b7d00d633e2c154","reviewer":"PENDING","decision":"PENDING","criteria":[{"name":"Theme identity","result":"PASS"},{"name":"Geometry / spatial hierarchy","result":"PASS"},{"name":"Silhouette / massing","result":"PASS"},{"name":"Negative space / composition","result":"PASS"},{"name":"Category fidelity","result":"PASS"},{"name":"Material / PBR","result":"PASS"},{"name":"Lighting / atmosphere","result":"PASS"},{"name":"Camera / cinematic framing","result":"PASS"},{"name":"Mobile/browser plausibility","result":"PASS"},{"name":"Cross-theme differentiation","result":"PASS"}],"notes":"PENDING"}'

permissions:
  actions: read
  contents: read

jobs:
  evidence-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download locked D3C evidence
        uses: actions/download-artifact@v5
        with:
          name: allpha-3d-v2-13d3c-cinematic-visual-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: urbanrealty36-ops/Allpha-Universe-PWA
          run-id: ${{ inputs.source_run_id || '37553533713' }}
          path: d3c-evidence

      - name: Write D3D human review record
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_JSON: ${{ inputs.review_json || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$REVIEW_JSON" > v2-13d3d-human-review.json
          elif [ -f v2-13d3d-human-review.json ]; then
            test -s v2-13d3d-human-review.json
          else
            echo "Missing checked-in D3D human review record on push."
            exit 1
          fi

      - name: Run post-D3D promotion decision gate
        id: gate
        continue-on-error: true
        run: node scripts/3d/v2-13d-post-d3d-promotion-gate.mjs
        env:
          ALLPHA_D3C_EVIDENCE_ROOT: d3c-evidence
          ALLPHA_D3D_REVIEW_JSON: v2-13d3d-human-review.json
          ALLPHA_3D_PRODUCTION_PROMOTION_APPROVED: ${{ vars.ALLPHA_3D_PRODUCTION_PROMOTION_APPROVED || 'false' }}

      - name: Publish decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d-post-d3d-promotion-decision
          path: |
            v2-13d3d-human-review.json
            v2-13d-post-d3d-promotion-decision.json
            d3c-evidence/v2-13d3c-review-sheets/*.jpg

      - name: Enforce final gate
        if: steps.gate.outcome == 'failure'
        run: exit 1
