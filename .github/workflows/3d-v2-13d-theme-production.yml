name: 3D-V2.13D 25 Theme Production Expansion

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/design-tokens/3d-visual-language.ts"
      - "packages/design-tokens/3d-golden-theme-factory.ts"
      - "scripts/3d/generate-v2-13c-theme-factory-manifest.mjs"
      - "scripts/3d/blender/build_v2_13_production_art.py"
      - "scripts/3d/blender/build_v2_13d_theme_production.py"
      - "scripts/3d/validate-v2-13d-theme-production.mjs"
      - "scripts/3d/review-v2-13d-preview-pack.py"
      - ".github/workflows/3d-v2-13d-theme-production.yml"
  push:
    branches: [codex/3d-v2-13d-25-theme-production-expansion, main]
    paths:
      - "packages/design-tokens/3d-visual-language.ts"
      - "packages/design-tokens/3d-golden-theme-factory.ts"
      - "scripts/3d/generate-v2-13c-theme-factory-manifest.mjs"
      - "scripts/3d/blender/build_v2_13_production_art.py"
      - "scripts/3d/blender/build_v2_13d_theme_production.py"
      - "scripts/3d/validate-v2-13d-theme-production.mjs"
      - "scripts/3d/review-v2-13d-preview-pack.py"
      - ".github/workflows/3d-v2-13d-theme-production.yml"
  workflow_dispatch:
    inputs:
      preview:
        description: "Render all 350 production previews"
        required: true
        default: true
        type: boolean

jobs:
  production-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install headless Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxrender1 libxext6 libxi6 libxfixes3
      - name: Install Blender 4.5.3
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_VERSION=4.5.3
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender4.5/${ARCHIVE}"
          curl -fsSL --retry 3 --retry-delay 2 "${URL}" -o "/tmp/${ARCHIVE}"
          sudo tar -xJf "/tmp/${ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version
      - name: Gate V2.13C factory manifest
        run: |
          node scripts/3d/generate-v2-13c-theme-factory-manifest.mjs
          node -e "const r=require('./allpha-v2-13c-theme-factory-manifest.json'); if(r.themes!==25||r.categories!==14||r.matrixSize!==350||r.goldenTheme!=='crystal-ai-city'||!r.ok) process.exit(1)"
      - name: Build 25 x 14 production GLB pack
        env:
          ALLPHA_V213D_OUT: allpha-theme-v2-13d-production
          ALLPHA_V213C_MANIFEST: allpha-v2-13c-theme-factory-manifest.json
        run: |
          if [ "${{ inputs.preview }}" = "false" ]; then
            blender -b --python scripts/3d/blender/build_v2_13d_theme_production.py --
          else
            blender -b --python scripts/3d/blender/build_v2_13d_theme_production.py -- --preview
          fi
      - name: Install Pillow for preview review
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Validate 350 production assets
        env:
          ALLPHA_V213D_OUT: allpha-theme-v2-13d-production
        run: node scripts/3d/validate-v2-13d-theme-production.mjs
      - name: Automated preview visual review
        env:
          ALLPHA_V213D_OUT: allpha-theme-v2-13d-production
        run: python scripts/3d/review-v2-13d-preview-pack.py
      - name: Upload V2.13D evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d-25-theme-production-evidence
          path: |
            allpha-theme-v2-13d-production/
            3d-v2-13d-production-validation-report.json
            3d-v2-13d-preview-review-report.json
          retention-days: 14

  r3-golden-gate:
    needs: production-expansion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download R2 production evidence
        uses: actions/download-artifact@v4
        with:
          name: allpha-3d-v2-13d-25-theme-production-evidence
          path: evidence
      - name: Execute V2.13D.1A-R3 exact Production Evidence Review & Golden Gate
        shell: bash
        env:
          R2_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs"), path=require("path");
          const root="evidence";
          const v=JSON.parse(fs.readFileSync(path.join(root,"3d-v2-13d-production-validation-report.json")));
          const r=JSON.parse(fs.readFileSync(path.join(root,"3d-v2-13d-preview-review-report.json")));
          const errors=[];
          if(v.schema!=="allpha-3d-v2-13d-validation/1.0"||v.ok!==true) errors.push("R2_VALIDATION_NOT_GREEN");
          if(v.themes!==25||v.categories!==14||v.assets!==350||v.previews!==350) errors.push("R2_COUNTS_INVALID");
          if((v.errors||[]).length) errors.push("R2_VALIDATION_ERRORS");
          if(r.schema!=="allpha-3d-v2-13d-preview-review/1.0"||r.automatedReview!=="PASS") errors.push("AUTOMATED_PREVIEW_REVIEW_NOT_GREEN");
          if(r.themes!==25||r.categories!==14||r.previews!==350||r.expectedPreviews!==350) errors.push("PREVIEW_COUNTS_INVALID");
          if((r.errors||[]).length) errors.push("PREVIEW_REVIEW_ERRORS");
          const sheets=fs.readdirSync(path.join(root,"allpha-theme-v2-13d-production","contact-sheets")).filter(x=>x.endsWith(".jpg")).length;
          if(sheets!==25) errors.push("CONTACT_SHEETS_INVALID:"+sheets);
          const out={schema:"allpha-3d-v2-13d-1a-r3-golden-gate/1.0",phase:"V2.13D.1A-R3",sourceR2RunId:process.env.R2_RUN_ID,goldenReference:"crystal-ai-city",themes:25,categories:14,assets:350,previews:350,contactSheets:25,automatedGoldenGate:errors.length?"FAIL":"PASS",humanVisualFidelityReview:"PENDING",promotionToStorage:"BLOCKED_UNTIL_R3_HUMAN_REVIEW",errors};
          fs.writeFileSync("3d-v2-13d-1a-r3-golden-gate-report.json",JSON.stringify(out,null,2)+"\n");
          console.log(JSON.stringify(out,null,2));
          if(errors.length) process.exit(1);
          NODE
      - name: Upload R3 Golden Gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d-1a-r3-golden-gate
          path: 3d-v2-13d-1a-r3-golden-gate-report.json
          retention-days: 30
