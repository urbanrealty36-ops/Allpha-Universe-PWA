name: Allpha Universe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-static:
    name: API syntax gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API
        run: python -m compileall -q app
      - name: Install API test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: pytest -q
        continue-on-error: true

  pwa-build:
    name: User PWA build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Build User PWA
        run: pnpm build:web

  admin-build:
    name: Super Admin build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Build Super Admin
        run: pnpm build:admin
