name: Allpha Universe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-static:
    name: API syntax gate
    runs-on: ubuntu-latest
    env:
      ALLPHA_CI_TEST_MODE: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API
        run: python -m compileall -q app
      - name: Install API test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: pytest -q

  pwa-build:
    name: User PWA build gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qltbacemtvnuzqkterly.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Mlit8qjZdM8OBlGm-jypIw_fd4LsQPZ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Validate browser Supabase build environment
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Audit Theme rebuild cutover
        run: pnpm audit:theme-rebuild
      - name: Build User PWA
        run: pnpm build:web
      - name: Authenticated V3 visual E2E (opt-in)
        env:
          ALLPHA_V3_E2E_BASE_URL: ${{ vars.ALLPHA_V3_E2E_BASE_URL }}
          ALLPHA_V3_E2E_STORAGE_STATE_JSON: ${{ secrets.ALLPHA_V3_E2E_STORAGE_STATE_JSON }}
          ALLPHA_V3_E2E_ROUTES: ${{ vars.ALLPHA_V3_E2E_ROUTES }}
        run: |
          if [[ -z "$ALLPHA_V3_E2E_BASE_URL" || -z "$ALLPHA_V3_E2E_STORAGE_STATE_JSON" || -z "$ALLPHA_V3_E2E_ROUTES" ]]; then
            echo "SKIP: authenticated V3 E2E requires ALLPHA_V3_E2E_BASE_URL, ALLPHA_V3_E2E_STORAGE_STATE_JSON, and ALLPHA_V3_E2E_ROUTES."
            exit 0
          fi
          printf '%s' "$ALLPHA_V3_E2E_STORAGE_STATE_JSON" > "$RUNNER_TEMP/allpha-v3-storage-state.json"
          export ALLPHA_V3_E2E_STORAGE_STATE="$RUNNER_TEMP/allpha-v3-storage-state.json"
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/e2e/v3-visual-fidelity.spec.ts --workers=1

  admin-build:
    name: Super Admin build gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qltbacemtvnuzqkterly.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Mlit8qjZdM8OBlGm-jypIw_fd4LsQPZ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Validate browser Supabase build environment
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Build Super Admin
        run: pnpm build:admin

  security-supply-chain:
    name: Security and supply-chain gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pip-audit
          pip-audit --skip-editable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
      - name: Detect dependency manifest changes
        id: dependency-files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '(package.json|pnpm-lock.yaml|pyproject.toml|requirements.*.txt|poetry.lock|uv.lock|Pipfile|Pipfile.lock|Cargo.lock|go.mod|go.sum)$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependency review
        if: github.event_name == 'pull_request' && steps.dependency-files.outputs.changed == 'true'
        uses: actions/dependency-review-action@v4
