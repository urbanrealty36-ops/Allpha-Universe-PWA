name: V2.13D.5 Runtime Asset Activation Consumption Verification

on:
  push:
    branches:
      - codex/v2-13d5-runtime-asset-consumption-verification
  pull_request:
    paths:
      - scripts/3d/v2-13d5-runtime-asset-consumption-verification.mjs
      - docs/3d/V2.13D.5-RUNTIME-ASSET-ACTIVATION-CONSUMPTION-VERIFICATION.md
      - .github/workflows/v2-13d5-runtime-asset-consumption-verification.yml
  workflow_dispatch:
    inputs:
      runtime_api_base:
        description: Production FastAPI runtime base URL
        required: true
        default: https://allpha-api-production.up.railway.app

permissions:
  contents: read

jobs:
  runtime-consumption:
    name: Verify 25x4 production runtime consumption
    runs-on: ubuntu-latest
    env:
      ALLPHA_RUNTIME_API_BASE: ${{ inputs.runtime_api_base || 'https://allpha-api-production.up.railway.app' }}
      ALLPHA_RUNTIME_WEB_BASE: https://allphaweb-production.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node
        run: node --version

      - name: Verify production runtime consumption
        run: node scripts/3d/v2-13d5-runtime-asset-consumption-verification.mjs

      - name: Upload V2.13D.5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d5-runtime-asset-consumption-evidence
          path: artifacts/v2-13d5/runtime-asset-consumption-report.json
          if-no-files-found: error
