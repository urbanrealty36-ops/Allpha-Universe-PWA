name: 3D-V2.13B Golden Validation and Runtime Activation

on:
  push:
    paths:
      - "scripts/3d/**"
      - "tests/3d-v2-13b-runtime.spec.ts"
      - ".github/workflows/3d-v2-13b-golden-validation.yml"
      - "apps/web/lib/world-engine/production-realistic-art-v2-13.ts"
      - "package.json"
  workflow_dispatch:
    inputs:
      promote:
        description: "Upload Crystal AI City golden GLBs and stage them in Supabase"
        required: true
        default: false
        type: boolean
      activate:
        description: "Activate the staged Crystal AI City assets after all validation gates pass"
        required: true
        default: false
        type: boolean

jobs:
  golden-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version
      - name: Build Crystal AI City golden pack
        env:
          ALLPHA_V213_OUT: allpha-theme-v2-13-golden-pack
          BLENDER_BIN: /opt/blender/blender
        run: |
          /opt/blender/blender -b --python scripts/3d/blender/build_v2_13_production_art.py -- --theme crystal-ai-city --preview
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Validate 14-category golden pack
        run: node scripts/3d/validate-v2-13b-golden-pack.mjs allpha-theme-v2-13-golden-pack
      - name: Upload golden evidence
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13b-crystal-ai-city-golden-evidence
          path: |
            allpha-theme-v2-13-golden-pack/**
            3d-v2-13b-golden-validation-report.json

  runtime-promotion:
    needs: golden-build
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-latest
    environment: allpha-production-3d-golden
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Download golden evidence
        uses: actions/download-artifact@v4
        with:
          name: allpha-3d-v2-13b-crystal-ai-city-golden-evidence
          path: allpha-theme-v2-13-golden-pack
      - name: Re-validate before Supabase promotion
        run: node scripts/3d/validate-v2-13b-golden-pack.mjs allpha-theme-v2-13-golden-pack
      - name: Stage or activate Crystal AI City
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLPHA_3D_PRODUCTION_PROMOTION_APPROVED: ${{ secrets.ALLPHA_3D_PRODUCTION_PROMOTION_APPROVED }}
        run: |
          if [ "${{ inputs.activate }}" = "true" ]; then
            node scripts/3d/activate-v2-13b-crystal-golden.mjs --root=allpha-theme-v2-13-golden-pack --activate
          else
            node scripts/3d/activate-v2-13b-crystal-golden.mjs --root=allpha-theme-v2-13-golden-pack
          fi
      - name: Upload runtime activation report
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13b-runtime-activation-report
          path: 3d-v2-13b-runtime-activation-report.json

  browser-runtime:
    needs: runtime-promotion
    if: ${{ inputs.promote == true && inputs.activate == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify signed manifest and WebGL runtime
        env:
          ALLPHA_QA_BASE_URL: https://allphaweb-production.up.railway.app
          NEXT_PUBLIC_API_BASE_URL: https://allpha-api-production.up.railway.app
        run: pnpm exec playwright test tests/3d-v2-13b-runtime.spec.ts --reporter=line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13b-browser-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
