name: V2.13D.6 Production PWA Browser Runtime Verification
run-name: V2.13D.6 Production PWA Browser Runtime Verification • ${{ github.event_name }}

on:
  push:
    branches:
      - codex/v2-13d6-production-pwa-browser-runtime-verification
    paths:
      - "scripts/3d/v2-13d6-production-pwa-browser-runtime-verification.mjs"
      - "docs/3d/V2.13D.6-PRODUCTION-PWA-BROWSER-RUNTIME-VERIFICATION.md"
      - ".github/workflows/v2-13d6-production-pwa-browser-runtime-verification.yml"
  pull_request:
    paths:
      - "scripts/3d/v2-13d6-production-pwa-browser-runtime-verification.mjs"
      - "docs/3d/V2.13D.6-PRODUCTION-PWA-BROWSER-RUNTIME-VERIFICATION.md"
      - ".github/workflows/v2-13d6-production-pwa-browser-runtime-verification.yml"
  workflow_dispatch:
    inputs:
      runtime_web_base:
        description: "Production PWA URL"
        required: false
        default: "https://allphaweb-production.up.railway.app"
      runtime_api_base:
        description: "Production FastAPI URL"
        required: false
        default: "https://allpha-api-production.up.railway.app"
      production_world_url:
        description: "Authoritative production World URL, e.g. /world?world_id=<id>"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  browser-runtime-gate:
    runs-on: ubuntu-latest
    env:
      ALLPHA_RUNTIME_WEB_BASE: ${{ inputs.runtime_web_base || 'https://allphaweb-production.up.railway.app' }}
      ALLPHA_RUNTIME_API_BASE: ${{ inputs.runtime_api_base || 'https://allpha-api-production.up.railway.app' }}
      ALLPHA_PRODUCTION_WORLD_URL: ${{ inputs.production_world_url }}
      ALLPHA_REQUIRE_WORLD_RUNTIME: "true"
    steps:
      - name: Checkout isolated phase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production PWA/browser runtime gate
        run: node scripts/3d/v2-13d6-production-pwa-browser-runtime-verification.mjs

      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allpha-3d-v2-13d6-production-pwa-browser-runtime-evidence
          path: v2-13d6-production-pwa-browser-runtime-report.json
          if-no-files-found: error
          retention-days: 90
